[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-web-data-service"
version = "0.1.0"
description = "Offline-first, audited web data acquisition agent"
requires-python = ">=3.11"

[project.scripts]
ai-web-agent = "ai_web_agent.cli:main"

[tool.setuptools.packages.find]
include = ["ai_web_agent*"]

